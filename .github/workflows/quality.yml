name: Website quality

on:
  pull_request:
    paths:
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/quality.yml"
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate static site
        run: npm run check
